name: Build Android app

# Run it by hand: GitHub, Actions tab, "Build Android app", Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: habit-tracker-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build the web app
        run: npm run build
        env:
          # the address of your Render backend, with /api at the end
          VITE_API_URL: https://habit-tracker-api-joov.onrender.com/api

      - name: Create the Android project
        run: npx cap add android

      - name: Add notification permissions
        run: node scripts/patch-android.mjs

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Use the saved signing key (so a new build installs over the old app)
        working-directory: .
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: habit-tracker-frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: habit-tracker-frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Habit Tracker app ${{ github.run_number }}
          files: habit-tracker-frontend/android/app/build/outputs/apk/debug/app-debug.apk
